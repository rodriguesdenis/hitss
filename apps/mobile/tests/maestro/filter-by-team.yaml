appId: host.exp.exponent
name: Tapping a team shows only its tasks with team chips
tags:
  - teams
---
- runFlow: common/sign-in.yaml
- tapOn:
    id: 'tab-teams'
- tapOn:
    id: 'team-00000000-0000-4000-8000-0000000000a2'
- extendedWaitUntil:
    visible: 'Buscar em Backend'
    timeout: 20000
- assertVisible:
    text: 'Backend'
    above: 'Buscar em Backend'
- scrollUntilVisible:
    element: 'Write the API contract examples'
- assertVisible: '.*Times: Backend, Mobile.*'
- assertNotVisible: 'Review the dark mode palette'
- scrollUntilVisible:
    element:
      id: 'status-filter-PENDING'
    direction: UP
- tapOn:
    id: 'status-filter-PENDING'
- assertVisible: 'Migrate the legacy reports to the new schema'
- assertNotVisible: 'Write the API contract examples'
- tapOn:
    id: 'status-filter-ALL'
- tapOn: 'Voltar para todas as tarefas'
- extendedWaitUntil:
    visible: 'Buscar tarefas'
    timeout: 10000
- assertVisible:
    text: 'Tarefas'
    above: 'Buscar tarefas'
- assertNotVisible: 'Voltar para todas as tarefas'
