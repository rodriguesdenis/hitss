packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts (pnpm blocks all others).
# Prisma's install step fetches the schema engine used by `prisma migrate`.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma

overrides:
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  '@nestjs/cli>webpack': 5.112.0
  react: 19.3.0
  react-dom: 19.3.0
