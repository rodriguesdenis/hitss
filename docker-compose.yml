# Teams & Tasks — local stack. Every setting has a working local default, so no .env is needed;
# if a .env exists compose reads it automatically (see .env.example). Secrets belong in .env only.
name: teams-tasks

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teams-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-teams_tasks}
    ports: ['${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: applies the Prisma migrations and exits. The API starts only if it succeeded.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    init: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teams-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-teams_tasks}
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    stop_grace_period: 15s
    # Hardening: no privilege escalation, no capabilities, immutable root filesystem.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # NODE_ENV stays "production" from the image; APP_ENV is the application environment.
      APP_ENV: ${APP_ENV:-local}
      PORT: 3000
      # The entrypoint builds DATABASE_URL from these parts (a provided DATABASE_URL wins), so no
      # password is ever inlined in a URL here. 5432 is the container-side port.
      POSTGRES_USER: ${POSTGRES_USER:-teams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teams-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-teams_tasks}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports: ['${API_BIND:-0.0.0.0}:${API_PORT:-3000}:3000']
    healthcheck:
      # TODO(T-001-08 / T-006-03): switch to GET /api/v1/health/ready once the health routes exist.
      # Interim: the API only starts after the migrate service succeeded and listens only after the
      # config is valid and the database module is up, so an open TCP port means "started".
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  pgdata: {}
