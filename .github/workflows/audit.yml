name: Dependency audit

# New advisories appear without any code change, so main is audited daily as well as on demand.
# The per-PR gate lives in ci.yml (job "audit").
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: 'false'
      - name: High/critical advisories fail unless allowlisted with an expiry
        run: pnpm audit:deps
