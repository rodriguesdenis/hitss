# Weekly, grouped update proposals (AC-07.9.3). Commit prefixes must satisfy commitlint:
# no `include: scope` (it would yield "deps-dev"), prefixes are fixed per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      opentelemetry:
        patterns: ['@opentelemetry/*', '@prisma/instrumentation']
      prisma:
        patterns: ['prisma', '@prisma/*']
      expo:
        patterns: ['expo', 'expo-*', '@expo/*', 'react-native*']
        update-types: [patch]
      types:
        patterns: ['@types/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Expo SDK and React Native upgrades are manual (Expo Go compatibility); only patches flow in.
      - dependency-name: 'expo'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
  # Container base images: the API and mobile Dockerfiles (node image pinned by minor and digest)
  # and the compose images.
  - package-ecosystem: docker
    directories: [/apps/api, /apps/mobile]
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build(infra)'
    ignore:
      # ADR-0003 pins PostgreSQL 17: a major upgrade is a deliberate migration, not an automatic bump.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build(infra)'
    ignore:
      # ADR-0003 pins PostgreSQL 17: a major upgrade is a deliberate migration, not an automatic bump.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
